<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Recognition</title>
    <link rel="stylesheet" href="stylepage.css">
</head>
<body>
    <header>
        <h1>AI Image Recognition</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="techheroes.html">Our Tech Heroes</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a href="AImodel.html" aria-current="page">AI Model Page</a></li>
            </ul>
        </nav>
    </header>

    <main class="width_set">
        <section class="ai-section" aria-labelledby="ai-title">
            <h2 id="ai-title">Try the image recognition model</h2>
            <p class="ai-description">Start your webcam to load the model and automatically see its predictions. Your camera stream stays in this browser.</p>

            <div class="ai-controls">
                <button type="button" id="startCameraBtn">Start Camera &amp; AI</button>
                <button type="button" id="stopCameraBtn" disabled>Stop Camera</button>
            </div>
            <p id="status" class="ai-status" role="status" aria-live="polite">Model not loaded.</p>

            <video id="camera" autoplay playsinline muted hidden></video>

            <h3>AI Predictions</h3>
            <div id="predictions" aria-live="polite"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
    <script src="model/script.js"></script>
</body>
</html>
